# VigilSystem local test broker (development only; the real system uses EMQX).
# Start it with ./run.sh: paths are relative to cloud/mosquitto/.

per_listener_settings false
allow_anonymous false
password_file passwd
acl_file acl

# MQTT over TLS only, same port as EMQX
listener 8883
cafile   certs/ca.crt
certfile certs/server.crt
keyfile  certs/server.key
tls_version tlsv1.2
require_certificate false

# No persistence: restarting the broker starts clean (useful for tests)
persistence false

# Verbose log: shows every CONNECT, PUBLISH, PUBACK and ACL denial
log_dest stdout
log_type all
connection_messages true
log_timestamp_format %H:%M:%S
